<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zonas de Barrido — OSCDS 2026</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#0f1117;--panel:#1a1d27;--panel2:#22263a;--border:#2e3352;
  --text:#e8eaf6;--text2:#9ba3c7;--accent:#4fc3f7;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  --cT:#e63946;--cC:#2196f3;--cS:#ffc107;
  --e1:#2b83ba;--e2:#1a9850;--e3:#f4a020;--e4:#d7191c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
header{background:var(--panel);border-bottom:2px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
header h1{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;}
header .sub{font-size:10px;color:var(--text2);}
.bar{background:var(--panel2);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap;}
.bar label{font-family:var(--mono);font-size:11px;color:var(--text2);white-space:nowrap;}
.zona-input{width:72px;background:var(--panel);color:var(--text);border:2px solid var(--accent);border-radius:6px;font-family:var(--mono);font-size:20px;font-weight:700;padding:4px 8px;text-align:center;}
.zona-input:focus{outline:none;border-color:white;}
.btn{background:var(--accent);color:#000;border:none;font-family:var(--mono);font-size:12px;font-weight:700;padding:6px 14px;border-radius:5px;cursor:pointer;}
.btn:hover{background:white;}
.btn-lay{background:transparent;border:1px solid var(--border);color:var(--text2);font-family:var(--mono);font-size:10px;padding:5px 10px;border-radius:4px;cursor:pointer;transition:all .15s;}
.btn-lay:hover,.btn-lay.active{background:var(--accent);color:#000;border-color:var(--accent);}
.btn-pdf{margin-left:auto;background:#1a3a1a;border:1px solid var(--e2);color:var(--e2);font-family:var(--mono);font-size:11px;font-weight:600;padding:6px 14px;border-radius:5px;cursor:pointer;white-space:nowrap;}
.btn-pdf:hover{background:var(--e2);color:white;}
.btn-pdf:disabled{opacity:.5;cursor:wait;}
.btn-all{background:#1a1a3a;border:1px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:11px;font-weight:600;padding:6px 14px;border-radius:5px;cursor:pointer;white-space:nowrap;}
.btn-all:hover{background:var(--accent);color:#000;}
.btn-all:disabled{opacity:.5;cursor:wait;}
.zona-badge{background:var(--panel);border:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--text2);padding:4px 10px;border-radius:5px;}
.main{display:flex;flex:1;overflow:hidden;}
.panel{width:300px;min-width:240px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
@media(max-width:680px){.main{flex-direction:column;}.panel{width:100%;max-width:100%;height:22vh;overflow-y:auto;border-right:none;border-bottom:1px solid var(--border);}#mapa{flex:1;min-height:0;}}
.ph{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel2);flex-shrink:0;}
.ph-title{font-family:var(--mono);font-size:13px;font-weight:700;}
.ph-meta{font-size:11px;color:var(--text2);margin-top:3px;}
.pscroll{overflow-y:auto;flex:1;padding:10px;}
.pscroll::-webkit-scrollbar{width:4px;}
.pscroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.rc{border-radius:6px;margin-bottom:7px;border-left:4px solid #444;background:rgba(255,255,255,.03);padding:8px 10px;}
.rc.T{border-left-color:var(--cT);}.rc.C{border-left-color:var(--cC);}.rc.S{border-left-color:var(--cS);}
.cr{display:flex;align-items:center;gap:6px;}
.bt{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;flex-shrink:0;}
.bt-T{background:var(--cT);color:white;}.bt-C{background:var(--cC);color:white;}.bt-S{background:var(--cS);color:#000;}
.be{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 5px;border-radius:3px;flex-shrink:0;}
.be-E1{background:var(--e1);color:white;}.be-E2{background:var(--e2);color:white;}
.be-E3{background:var(--e3);color:#333;}.be-E4{background:var(--e4);color:white;}.be-Q{background:#555;color:white;}
.cc{font-family:var(--mono);font-size:11px;font-weight:600;flex:1;}
.cb{font-size:10px;color:var(--text2);margin-top:3px;}
.empty{padding:30px 20px;text-align:center;color:var(--text2);font-size:12px;line-height:1.9;}
#mapa{flex:1;z-index:1;}
.leaflet-container{background:#ddd;}
.map-legend{background:rgba(15,17,23,.93);border:1px solid #2e3352;border-radius:6px;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#e8eaf6;line-height:1.9;}
.li{display:flex;align-items:center;gap:6px;}
.lb{width:14px;height:10px;border-radius:2px;flex-shrink:0;}
#overlay-progress{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
#overlay-progress.show{display:flex;}
.prog-msg{font-family:'IBM Plex Mono',monospace;font-size:14px;color:#4fc3f7;text-align:center;max-width:400px;}
.prog-bar-wrap{width:320px;height:8px;background:#2e3352;border-radius:4px;overflow:hidden;}
.prog-bar{height:100%;background:#4fc3f7;border-radius:4px;transition:width .3s;}
.prog-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text2);}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  header,.bar,.panel,#mapa,#overlay-progress{display:none!important;}
  #print-sheet{display:block!important;}
  body{background:white;color:black;overflow:visible;height:auto;display:block;}
  .print-page{width:190mm;padding:10mm 12mm;page-break-after:always;break-after:page;font-family:'IBM Plex Sans',sans-serif;}
  .print-page:last-child{page-break-after:auto;break-after:auto;}
  .pz-header{border-bottom:3px solid black;padding-bottom:3mm;margin-bottom:4mm;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .pz-num{font-family:'IBM Plex Mono',monospace;font-size:32pt;font-weight:700;}
  .pz-num span{color:#e63946;}
  .pz-sub{font-size:10pt;color:#444;}
  .pmap-box{width:100%;height:125mm;border:2px solid #333;border-radius:3px;overflow:hidden;margin-bottom:3mm;}
  .pmap-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .pmap-box .no-img{display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-family:monospace;font-size:11px;}
  .ley{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:3mm;font-size:7pt;font-family:'IBM Plex Mono',monospace;align-items:center;}
  .ley-i{display:flex;align-items:center;gap:3px;}
  .ley-d{width:12px;height:8px;border-radius:2px;}
  .ptable{width:100%;border-collapse:collapse;font-size:9pt;font-family:'IBM Plex Mono',monospace;}
  .ptable th{background:#eee;padding:4px 8px;text-align:left;border:1px solid #ccc;font-size:8pt;}
  .ptable td{padding:5px 8px;border:1px solid #ddd;vertical-align:middle;}
  .ptable tr.rT td:first-child{border-left:5px solid #e63946;}
  .ptable tr.rC td:first-child{border-left:5px solid #2196f3;}
  .ptable tr.rS td:first-child{border-left:5px solid #ffc107;}
  .bp{display:inline-block;padding:1px 6px;border-radius:3px;font-weight:700;font-size:8pt;}
  .bp-T{background:#e63946;color:white;}.bp-C{background:#2196f3;color:white;}.bp-S{background:#ffc107;color:#000;}
  .bp-E1{background:#2b83ba;color:white;}.bp-E2{background:#1a9850;color:white;}
  .bp-E3{background:#f4a020;color:#333;}.bp-E4{background:#d7191c;color:white;}
  .pfooter{margin-top:4mm;font-size:7pt;color:#888;font-family:'IBM Plex Mono',monospace;border-top:1px solid #ddd;padding-top:2mm;}
}
#print-sheet{display:none;}
</style>
</head>

<header>
  <div>
    <h1>▣ ZONAS DE BARRIDO — OSCDS 2026</h1>
    <div class="sub">Proyecto Pantallas · Primera Infancia · UNC-SeCyT</div>
  </div>
</header>
<div class="bar">

  <button class="btn-lay" id="btn-ubic" onclick="miUbicacion()" title="Mi ubicación">📍 Yo</button>
</div>
<div class="main">
  <div class="panel">
    <div class="ph">
      <div class="ph-title" id="panel-title">Ingresá tu número de zona</div>

    <div class="pscroll" id="panel-scroll">

        <b>T</b> = Titular · <b>C</b> = Complementario · <b>S</b> = Suplente

    </div>
  </div>
  <div id="mapa"></div>
</div>
<div id="overlay-progress">
  <div class="prog-msg" id="prog-msg">Preparando...</div>
  <div class="prog-bar-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
  <div class="prog-sub" id="prog-sub"></div>
</div>
<div id="print-sheet"></div>

143114", "barrio": "GENERAL MOSCONI"}]}};
const C_TIPO={TITULAR:'#e63946',COMPLEMENTARIO:'#2196f3',SUPLENTE:'#ffc107'};
const C_E={E1:'#2b83ba',E2:'#1a9850',E3:'#f4a020',E4:'#d7191c','?':'#888888'};
const LETRA={TITULAR:'T',COMPLEMENTARIO:'C',SUPLENTE:'S'};

let mapa,layerGroup,tileOSM,tileSAT,tileGOOG,zonaActual=null;

function initMapa(){
  mapa=L.map('mapa',{zoomControl:true}).setView([-31.42,-64.18],12);
  tileOSM=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:19});
  tileSAT=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19});
  tileGOOG=L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{attribution:'© Google',maxZoom:20});
  tileOSM.addTo(mapa);
  layerGroup=L.featureGroup().addTo(mapa);
  const leg=L.control({position:'bottomright'});
  leg.onAdd=()=>{
    const d=L.DomUtil.create('div','map-legend');
    d.innerHTML='<div style="font-weight:700;margin-bottom:4px;color:#4fc3f7">Referencias</div>'
      +'<div class="li"><div class="lb" style="background:#e63946"></div><b>T</b> Titular</div>'
      +'<div class="li"><div class="lb" style="background:#2196f3"></div><b>C</b> Complementario</div>'
      +'<div class="li"><div class="lb" style="background:#ffc107"></div><b>S</b> Suplente</div>'
      ;
    return d;
  };
  leg.addTo(mapa);
}

function setLayer(name,btn){
  [tileOSM,tileSAT,tileGOOG].forEach(t=>{try{mapa.removeLayer(t);}catch(e){}});
  if(name==='osm')tileOSM.addTo(mapa);
  if(name==='sat')tileSAT.addTo(mapa);
  if(name==='goog')tileGOOG.addTo(mapa);
  document.querySelectorAll('.btn-lay').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function buscarZona(){
  const n=parseInt(document.getElementById('zona-input').value);
  if(!n||n<1||n>60){alert('Ingresá un número entre 1 y 60');return;}
  zonaActual=n; cargarZona(n);
}

function getEstrato(cod){
  const f=GEOJSON.features.find(f=>f.properties.cod===cod);
  return f?f.properties.estrato:'?';
}

function getTodos(zona){
  const m={};
  m[zona.titular]='TITULAR';
  zona.complementarios.forEach(c=>{m[c.cod]='COMPLEMENTARIO';});
  zona.suplentes.forEach(s=>{m[s.cod]='SUPLENTE';});
  return m;
}

function cargarZona(n){
  const zona=ZONAS[String(n)];
  if(!zona)return;
  document.getElementById('zona-badge').textContent='Zona '+n+' / 60';
  const ec={E1:'#2b83ba',E2:'#1a9850',E3:'#f4a020',E4:'#d7191c','?':'#888'};
  document.getElementById('panel-title').innerHTML=
    '<span style="color:'+(ec[zona.estrato]||'#4fc3f7')+'">['+zona.estrato+']</span> ZONA '+n+' — '+zona.barrio;
  const tipo_z = TIPO_RECORRIDO[zona.titular] || 1;
  const tipo_lbl = TIPO_LABEL[tipo_z];
  document.getElementById('panel-meta').innerHTML=
    zona.titular+'<br><span style=\'font-size:10px;color:#4fc3f7\'>Tipo '+tipo_lbl+'</span>';
  let html='';
  html+=card(zona.titular,'TITULAR',zona.estrato,zona.barrio);
  zona.complementarios.forEach(c=>html+=card(c.cod,'COMPLEMENTARIO',getEstrato(c.cod),c.barrio));
  zona.suplentes.forEach(s=>html+=card(s.cod,'SUPLENTE',getEstrato(s.cod),s.barrio));
  document.getElementById('panel-scroll').innerHTML=html;
  renderMapa(n,zona);
}

function card(cod,tipo,estrato,barrio){
  const l=LETRA[tipo],ek=estrato==='?'?'Q':estrato;
  return '<div class="rc '+l+'"><div class="cr">'
    +'<span class="bt bt-'+l+'">'+l+'</span>'
    +'<span class="be be-'+ek+'">'+estrato+'</span>'
    +'<span class="cc">'+cod+'</span></div>'
    +'<div class="cb">'+barrio+'</div></div>';
}

function agregarPoligonos(grupo,todos,sz){
  GEOJSON.features.forEach(feat=>{
    const cod=feat.properties.cod;
    if(!todos[cod])return;
    const tipo=todos[cod];
    const color=C_TIPO[tipo];
    const fill=C_E[feat.properties.estrato]||'#888';
    const layer=L.geoJSON(feat,{style:{
      color,weight:tipo==='TITULAR'?4:2.5,
      fillColor:fill,fillOpacity:tipo==='TITULAR'?.4:.25,
      dashArray:tipo==='SUPLENTE'?'6,5':null
    }}).addTo(grupo);
    // Para TITULAR: usar centroide del bbox solo si cae dentro, si no usar punto garantizado dentro
    let center=layer.getBounds().getCenter();
    if(tipo==='TITULAR'){
      // Verificar si el centro cae dentro usando ray casting
      const _c=feat.geometry.coordinates[0];
      const _inPoly=(lat,lng)=>{
        let inside=false;
        for(let i=0,j=_c.length-1;i<_c.length;j=i++){
          const xi=_c[i][0],yi=_c[i][1],xj=_c[j][0],yj=_c[j][1];
          if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))inside=!inside;
        }
        return inside;
      };
      if(!_inPoly(center.lat,center.lng)){
        // Usar el centroide ponderado (promedio simple de vértices)
        const _mlat=_c.reduce((s,c)=>s+c[1],0)/_c.length;
        const _mlng=_c.reduce((s,c)=>s+c[0],0)/_c.length;
        // Si tampoco cae dentro, usar el vértice central del polígono
        center=_inPoly(_mlat,_mlng)?{lat:_mlat,lng:_mlng}:{lat:_c[Math.floor(_c.length/2)][1],lng:_c[Math.floor(_c.length/2)][0]};
      }
    }
    const l=LETRA[tipo];
    const icon=L.divIcon({className:'',
      html:'<div style="font-family:monospace;font-weight:900;font-size:'+(sz||13)+'px;'
        +'color:'+(tipo==='SUPLENTE'?'#000':'white')+';background:'+color
        +';padding:3px 8px;border-radius:4px;border:2px solid white;'
        +'box-shadow:0 1px 5px rgba(0,0,0,.5)">'+l+'</div>',
      iconAnchor:[10,10]
    });
    L.marker([center.lat,center.lng],{icon,interactive:false}).addTo(grupo);
    layer.bindPopup('<b>'+tipo+'</b><br>'+cod+'<br>'+feat.properties.barrio);
  });
}

function renderMapa(n,zona){
  layerGroup.clearLayers();
  const todos=getTodos(zona);
  agregarPoligonos(layerGroup,todos,13);
  const titularFeat=GEOJSON.features.find(f=>f.properties.cod===zona.titular);
  if(titularFeat){
    const tLayer=L.geoJSON(titularFeat);
    const center=tLayer.getBounds().getCenter();
    mapa.setView([center.lat,center.lng],15);
  }

  // Punto de inicio — esquina noroeste del titular
  const nr = NOROESTES[String(n)];
  if(nr){
    const tipo = TIPO_RECORRIDO[zona.titular] || 1;
    const tl = TIPO_LABEL[tipo];
    // Determinar color e ícono según tipo
    const esPerifera = tipo === 3;
    const startLat = nr.lat, startLon = nr.lon;
    const icon = L.divIcon({
      className:'',
      html:`<div style="
        background:${esPerifera?'#e63946':'#1a9850'};
        color:white;font-weight:900;font-size:12px;
        padding:4px 8px;border-radius:20px;
        border:3px solid white;
        box-shadow:0 2px 8px rgba(0,0,0,.5);
        white-space:nowrap;
      ">${esPerifera?'⚠️ IR AL COMP':'📍 ARRANQUE'}</div>`,
      iconAnchor:[40,15]
    });
    L.marker([startLat, startLon], {icon, interactive:true})
      .bindPopup(`<div style="font-family:monospace;font-size:12px;min-width:200px">
        <b>${esPerifera?'⚠️ ZONA DE PERIFERIA':'📍 PUNTO DE ARRANQUE'}</b><br>
        ${esPerifera
          ? 'No empezar por el titular.<br>Ir directamente al Complementario 1.'
          : 'Empezá por esta esquina.<br>Zig-zag N→S, adecuá al terreno.'}
        <hr style="margin:4px 0">
        <b>Tipo:</b> ${tl}
      </div>`, {maxWidth:250})
      .addTo(layerGroup);

    // Flecha norte en el mapa (indicador fijo)
    if(!mapa._northControl){
      const nc = L.control({position:'topleft'});
      nc.onAdd = ()=>{
        const d = L.DomUtil.create('div');
        d.innerHTML = '<div style="background:rgba(15,17,23,.9);color:#4fc3f7;font-size:11px;font-family:monospace;padding:6px 10px;border-radius:6px;border:1px solid #2e3352;text-align:center;"><div style="font-size:18px">&#8593;</div>NORTE</div>';
        return d;
      };
      nc.addTo(mapa);
      mapa._northControl = nc;
    }
  }
}

// ── STADIA MAPS STATIC URL ──
function buildStaticUrl(zona, width, height){
  const titular=zona.titular;
  const titularFeat=GEOJSON.features.find(f=>f.properties.cod===titular);
  if(!titularFeat) return null;

  const geom=titularFeat.geometry;
  const rings=geom.type==='Polygon'?geom.coordinates:geom.coordinates.flatMap(p=>p);
  const lons=rings.flatMap(r=>r.map(pt=>pt[0]));
  const lats=rings.flatMap(r=>r.map(pt=>pt[1]));
  const clon=((Math.min(...lons)+Math.max(...lons))/2).toFixed(6);
  const clat=((Math.min(...lats)+Math.max(...lats))/2).toFixed(6);

  const todos=getTodos(zona);
  const features=[];
  GEOJSON.features.forEach(feat=>{
    const cod=feat.properties.cod;
    if(!todos[cod]) return;
    const tipo=todos[cod];
    const color=C_TIPO[tipo];
    const fill=C_E[feat.properties.estrato]||'#888888';
    features.push({
      type:'Feature',
      geometry:feat.geometry,
      properties:{
        'stroke':color,
        'stroke-width':tipo==='TITULAR'?4:2,
        'stroke-opacity':1,
        'fill':fill,
        'fill-opacity':tipo==='TITULAR'?0.4:0.25
      }
    });
  });

  const overlay=JSON.stringify({type:'FeatureCollection',features});
  const overlayEnc=encodeURIComponent(overlay);

  // Stadia Maps Static Maps API
  return `https://tiles.stadiamaps.com/static/osm_bright.png?center=${clon},${clat}&zoom=15&width=${width}&height=${height}&geojson=${overlayEnc}`;
}

async function fetchMapImage(url){
  try{
    const resp=await fetch(url);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const blob=await resp.blob();
    return new Promise((resolve)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>resolve('');
      reader.readAsDataURL(blob);
    });
  }catch(e){
    console.error('fetchMapImage:',e);
    return '';
  }
}

function buildPaginaZona(n,zona,imgDataUrl){
  const rows=[];
  rows.push({cod:zona.titular,tipo:'TITULAR',estrato:zona.estrato,barrio:zona.barrio});
  zona.complementarios.forEach(c=>rows.push({cod:c.cod,tipo:'COMPLEMENTARIO',estrato:getEstrato(c.cod),barrio:c.barrio}));
  zona.suplentes.forEach(s=>rows.push({cod:s.cod,tipo:'SUPLENTE',estrato:getEstrato(s.cod),barrio:s.barrio}));
  const tableRows=rows.map(r=>{
    const l=LETRA[r.tipo],ek=r.estrato==='?'?'Q':r.estrato;
    return '<tr class="r'+l+'"><td><span class="bp bp-'+l+'">'+l+'</span></td>'
      +'<td>'+r.cod+'</td><td><span class="bp bp-'+ek+'">'+r.estrato+'</span></td>'
      +'<td>'+r.barrio+'</td></tr>';
  }).join('');
  const mapContent=imgDataUrl
    ?'<img src="'+imgDataUrl+'" style="width:100%;height:100%;object-fit:cover;display:block">'
    :'<div class="no-img">Sin imagen — verificar conexión</div>';
  return '<div class="print-page">'
    +'<div class="pz-header"><div class="pz-num">ZONA <span>'+n+'</span></div>'
    +'<div class="pz-sub">['+zona.estrato+'] '+zona.barrio+' · '+rows.length+' radio'+(rows.length>1?'s':'')+'</div></div>'
    +'<div class="pmap-box">'+mapContent+'</div>'
    +'<div class="ley">'
    +'<div class="ley-i"><div class="ley-d" style="background:#e63946"></div>T=TITULAR</div>'
    +'<div class="ley-i"><div class="ley-d" style="background:#2196f3"></div>C=COMPLEMENTARIO</div>'
    +'<div class="ley-i"><div class="ley-d" style="background:#ffc107"></div>S=SUPLENTE</div>'
    
    +'</div>'
    +'<table class="ptable"><thead><tr><th>Tipo</th><th>Código INDEC</th><th>Estrato</th><th>Barrio</th></tr></thead>'
    +'<tbody>'+tableRows+'</tbody></table>'
    +'<div class="pfooter">OSCDS · Pantallas · UNC-SeCyT 2026 · Zona '+n+' de 60</div>'
    +'</div>';
}

function setProgreso(pct,msg,sub){
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-msg').textContent=msg;
  document.getElementById('prog-sub').textContent=sub||'';
}

async function imprimirUna(){
  const n=zonaActual;
  if(!n){alert('Primero seleccioná una zona');return;}
  const zona=ZONAS[String(n)];
  if(!zona)return;
  const btn=document.getElementById('btn-imprimir');
  btn.disabled=true;
  document.getElementById('overlay-progress').classList.add('show');
  setProgreso(10,'Generando mapa Zona '+n+'...','Descargando imagen desde Stadia Maps...');
  const url=buildStaticUrl(zona,800,500);
  const img=url?await fetchMapImage(url):'';
  setProgreso(80,'Armando hoja...','');
  document.getElementById('print-sheet').innerHTML=buildPaginaZona(n,zona,img);
  setProgreso(100,'¡Listo!','');
  document.getElementById('overlay-progress').classList.remove('show');
  btn.disabled=false;
  setTimeout(()=>window.print(),300);
}

async function imprimirTodas(){
  const btn=document.getElementById('btn-all');
  const btn2=document.getElementById('btn-imprimir');
  btn.disabled=true; btn2.disabled=true;
  document.getElementById('overlay-progress').classList.add('show');
  let pagesHTML='';
  for(let n=1;n<=60;n++){
    setProgreso(Math.round((n-1)/60*90)+5,'Zona '+n+' de 60...','Descargando mapa...');
    const zona=ZONAS[String(n)];
    if(!zona){continue;}
    const url=buildStaticUrl(zona,800,500);
    const img=url?await fetchMapImage(url):'';
    pagesHTML+=buildPaginaZona(n,zona,img);
    await new Promise(r=>setTimeout(r,150));
  }
  setProgreso(95,'Armando 60 páginas...','');
  document.getElementById('print-sheet').innerHTML=pagesHTML;
  setProgreso(100,'¡Listo!','');
  document.getElementById('overlay-progress').classList.remove('show');
  btn.disabled=false; btn2.disabled=false;
  setTimeout(()=>window.print(),500);
}

function miUbicacion(){
  const btn=document.getElementById('btn-ubic');
  btn.textContent='⏳';
  btn.disabled=true;
  if(!navigator.geolocation){
    alert('Tu navegador no soporta geolocalización');
    btn.textContent='📍 Yo'; btn.disabled=false; return;
  }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude, lon=pos.coords.longitude;
      mapa.setView([lat,lon],17);
      // Marcador de posición
      if(window._miPosMarker) window._miPosMarker.remove();
      window._miPosMarker=L.marker([lat,lon],{
        icon:L.divIcon({className:'',
          html:'<div style="width:18px;height:18px;background:#4fc3f7;border:3px solid white;border-radius:50%;box-shadow:0 0 0 3px rgba(79,195,247,.4)"></div>',
          iconAnchor:[9,9]
        })
      }).addTo(mapa).bindPopup('📍 Tu ubicación actual').openPopup();
      btn.textContent='📍 Yo'; btn.disabled=false;
    },
    err=>{
      alert('No se pudo obtener tu ubicación. Permití el acceso en el navegador.');
      btn.textContent='📍 Yo'; btn.disabled=false;
    },
    {enableHighAccuracy:true, timeout:10000}
  );
}

document.addEventListener('DOMContentLoaded',()=>{
  initMapa();
  document.getElementById('zona-input').addEventListener('keydown',e=>{
    if(e.key==='Enter')buscarZona();
  });
});
